# Blueprint Render — déploie le serveur push automatiquement.
# Sur render.com : New > Blueprint > connecte ce repo GitHub, Render lit ce fichier.
services:
  - type: web
    name: tamerelechat-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DEADLINE_SEC
        value: "10"

  # Serveur du jeu RELAIS (chaîne mondiale + territoires).
  - type: web
    name: relais-server
    runtime: node
    plan: free
    rootDir: relais
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Persistance Supabase (optionnelle) — à renseigner dans le dashboard Render.
      # Sans elles, le serveur tourne en mémoire. Voir relais/SETUP_SUPABASE.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
